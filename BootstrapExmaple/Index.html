<!doctype html>
<html lang="en">

    <title>Document</title>

    <link

  <body>
    <header
      class="d-flex position-fixed z-2 top-0 start-0 end-0 align-items-center p-1 border border-opacity-25 border-black shadow-lg bg-white text-white justify-content-between px-3"
    >
      <div
        class="d-flex fs-2 mt-1 text-dark align-items-center justify-content-center"
      >
        <p class="bi bi-bag-fill me-2 text-success "></p>
        <p class="fw-bold">Shopping</p>
      </div>
      <nav class="d-flex align-items-center text-black fw-medium">
        <span>HOME</span>
        <span class="mx-3">ABOUT</span>
        <span>CONTACT</span>
        <span class="mx-3">SHOP</span>
        <span>BLOG</span>
      </nav>

      <div class="input-group w-25">
        <select class="input-group-text">
          <option>All</option>
        </select>
        <input type="text" placeholder="Search" class="form-control" />
        <button
          class="bi bi-search btn btn-warning text-white fw-bold"
        ></button>
      </div>

      <div class="d-flex align-items-center gap-3">
  
  <button
    class="btn btn-warning rounded-pill fw-bold position-relative d-flex align-items-center gap-2 px-3"
  >
    <span class="bi bi-cart3 fs-5"></span>
    <span>Cart</span>

    <span
      class="badge rounded-pill bg-danger position-absolute top-0 start-100 translate-middle"
    >
      2
    </span>
  </button>

  <div class="d-flex gap-2">
    <button class="btn btn-primary fw-bold">
      Sign In
    </button>

    <button class="btn btn-info fw-bold">
      Sign Out
    </button>
  </div>

</div>
    </header>

    <section class="h-100  overflow-scroll" style="margin-top: 100px;">
      <div class=" mb-5 px-5">
   <div class="d-flex justify-content-between align-items-center">
       <ul class="list-unstyled breadcrumb" style="--bs-breadcrumb-divider:'>' ">
        <li class="breadcrumb-item text-primary">item-1</li>
        <li class="breadcrumb-item fw-bold text-success">item-2</li>
        <li class="breadcrumb-item text-danger">item-3</li>
        <li class="breadcrumb-item text-info">item-4</li>
        <li class="breadcrumb-item text-warning">item-5</li>
     
      </ul>
       <ul class="list-unstyled list-group-horizontal list-group">
        <li class="list-group-item list-group-item-info">item-1</li>
        <li class="list-group-item list-group-item-primary">item-2</li>
        <li class="list-group-item list-group-item-denger">item-3</li>
        <li class="list-group-item list-group-item-warning">item-4</li>
        <li class="list-group-item list-group-item-success">item-5</li>
     
      </ul>
   </div>
      </div>
     <div class="modal">
      <div class="modal-dialog">
    <section class="d-flex justify-content-center modal-content"> 
        <form class="shadow-lg px-3 py-4 w-25 rounded-4">
        <h2 class="bi bi-person text-center mb-3">Login</h2>
        <div class="mb-2">
          <label class="form-label fw-bold">UserName</label>
          <div class="form-floating">
            <input type="text" placeholder="userName" id="floating" class="form-control" />
            <label class="floating">UserName</label>
          </div>
        </div>
        <div class="mb-2">
          <label class="form-label fw-bold">Password</label>
          <div class="form-floating">
            <input
              type="password"
              placeholder="Password"
              class="form-control"
              id="userpas"
            />
            <label id="userpas">password</label>
          </div>
        </div class="mb-2">
        <div class="mb-2">
          <label class="form-label fw-bold">Country</label>
          <div class="form-floating">
            <select class="form-select" id="selectform">
              <option>Selct Country</option>
              <option>India</option>
              <option>USA</option>
              <option>JAPAN</option>
            </select>
            <label for="selectform">Chhose Your Won Country</label>
          </div>
        </div>
          <div class="mb-2">
          <label class="form-label fw-bold">Range</label>
          <div>
            <input type="range" min="1" max="5" class="form-range" />
          </div>
        </div>
         <div class="mb-3 ">
          <label class="form-check-label fw-bold">Subscribe</label>
          <div class="form-switch">
            <input type="checkbox" class="form-check-input" /> <span>Yes</span>
          </div>
        </div>

        <div>
            <button class="btn btn-primary w-100" >SUBMIT</button>
        </div>
        
      </form>
    </section>
      </div>
     </div>
      
   <div class="mt-5 px-5">   <table class="table table-responsive table-bordered table-striped table-hover">
    <caption class="fw-bold caption-top">User Table</caption>
        <thead>
         <tr class="text-center">
          <th>ID</th>
          <th>Name</th>

      <div class="pb-5 justify-content-end d-flex pe-5">
       
        <ul class="pagination">
          <li class="page-item"><a class="page-link">&laquo;</a></li>
          <li class="page-item"><a class="page-link">1</a></li>
          <li class="page-item active"><a class="page-link">2</a></li>
