      li {
        width: 50px;
        height: 50px;
        background: green;
        color: white;
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
        box-shadow: 2px 2px rgb(3, 86, 3);
      }
      li::after {
        content: "";
        position: absolute;
        left: 100%;
        top: 50%;
        width: 60px;
        height: 4px;
        background: green;
        transform: translateY(-50%);
      }
      li:nth-child(3)::after {
        background: rgb(253, 254, 253);
        box-shadow: 2px 2px gray;
      }
      li:last-child {
        background: white;
        color: green;
        border: 1px solid gray;
        box-shadow: 2px 2px gray;
      }
      li:last-child::after {
        display: none;
      }
    </style>
  </head>
