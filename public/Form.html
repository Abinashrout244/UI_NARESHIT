<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up</title>
    <!-- Remixicon for icons -->
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css"
      rel="stylesheet"
    />
    <!-- Flag Icons for Indian Flag -->
    <link
      href="https://cdn.jsdelivr.net/gh/lipis/flag-icons@7.2.3/css/flag-icons.min.css"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: url("../public/images/frombg.webp") no-repeat center
          center / cover;
        padding: 30px 15px;
      }

      .login-card {
        width: 440px;
        padding: 35px 30px;
        background: rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(15px);
        -webkit-backdrop-filter: blur(15px);
        border-radius: 20px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .login-card h2 {
        color: #ffffff;
        text-align: center;
        font-size: 28px;
        font-weight: 600;
        letter-spacing: 0.5px;
        margin-bottom: 4px;
      }

      .row {
        display: flex;
        gap: 12px;
        width: 100%;
      }

      .input-box {
        display: flex;
        flex-direction: column;
        gap: 6px;
        width: 100%;
      }

      .input-box label {
        color: #ffffff;
        font-size: 13px;
        font-weight: 500;
        margin-left: 10px;
      }

      .input-wrapper {
        position: relative;
        display: flex;
        align-items: flex-start;
        width: 100%;
      }

      .input-wrapper dd {
        margin: 0;
        position: relative;
        display: flex;
        flex-direction: column;
        width: 100%;
      }

      .input-wrapper input {
        width: 100%;
        height: 44px;
        padding: 0 42px 0 42px;
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.25);
        border-radius: 30px;
        outline: none;
        color: #ffffff;
        font-size: 14px;
        transition: border 0.3s ease;
      }

      .input-wrapper input::placeholder {
        color: rgba(255, 255, 255, 0.6);
      }

      .input-wrapper input:focus {
        border-color: rgba(255, 255, 255, 0.6);
      }

      .input-wrapper .left-icon {
        position: absolute;
        left: 15px;
        top: 22px;
        transform: translateY(-50%);
        color: rgba(255, 255, 255, 0.8);
        font-size: 18px;
        pointer-events: none;
        z-index: 2;
      }

      .input-wrapper .tick-icon {
        position: absolute;
        right: 15px;
        top: 22px;
        transform: translateY(-50%);
        color: #2ecc71;
        font-size: 18px;
        pointer-events: none;
        z-index: 2;
        display: none;
      }

      .input-wrapper .cross-icon {
        position: absolute;
        right: 15px;
        top: 22px;
        transform: translateY(-50%);
        color: #ff6b6b;
        font-size: 18px;
        pointer-events: none;
        z-index: 2;
        display: none;
      }

      /* Indian Phone Field Styling */
      .phone-wrapper input {
        padding-left: 78px;
      }

      .phone-prefix {
        position: absolute;
        left: 15px;
        top: 22px;
        transform: translateY(-50%);
        display: flex;
        align-items: center;
        gap: 6px;
        color: #ffffff;
        font-size: 13px;
        font-weight: 500;
        pointer-events: none;
        z-index: 2;
      }

      .phone-prefix .fi {
        border-radius: 2px;
      }

      /* Gender Section */
      .gender-options {
        display: flex;
        gap: 20px;
        padding-left: 10px;
      }

      .radio-label {
        display: flex;
        align-items: center;
        gap: 6px;
        color: rgba(255, 255, 255, 0.85);
        font-size: 13px;
        cursor: pointer;
        margin-left: 0 !important;
      }

      .radio-label input[type="radio"] {
        accent-color: #2ecc71;
        cursor: pointer;
      }

      /* Checkbox Terms */
      .terms-box {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-left: 5px;
        color: rgba(255, 255, 255, 0.85);
        font-size: 13px;
        cursor: pointer;
      }

      .terms-box input[type="checkbox"] {
        accent-color: #2ecc71;
        cursor: pointer;
        width: 15px;
        height: 15px;
      }

      .terms-box a {
        color: #ffffff;
        text-decoration: underline;
      }
  

      .submit-btn {
        width: 100%;
        padding: 13px;
        margin-top: 6px;
        border: none;
        border-radius: 30px;
        background: #ffffff;
        color: #222222;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition:
          background 0.3s ease,
          transform 0.1s ease;
      }

      .submit-btn:hover {
        background: rgba(255, 255, 255, 0.85);
      }

      .submit-btn:active {
        transform: scale(0.98);
      }

      .helper-text {
        font-size: 11px;
        color: rgba(255, 255, 255, 0.7);
        font-style: normal;
        margin-top: 5px;
        margin-left: 14px;
        letter-spacing: 0.3px;
        display: none;
      }

      /* Validation Icon Logic */
      dd input:valid ~ .tick-icon {
        display: block;
      }
      dd input:valid ~ .cross-icon {
        display: none;
      }
      dd input:focus:not(:placeholder-shown):invalid ~ .cross-icon {
        display: block;
      }
      dd input:focus:not(:placeholder-shown):invalid ~ .tick-icon {
        display: none;
      }

      /* Helper Text Validation Logic */
      dd input:focus:placeholder-shown ~ .helper-text {
        display: block;
        color: rgba(255, 255, 255, 0.85);
      }
      dd input:focus:not(:placeholder-shown):invalid ~ .helper-text {
        display: block;
        color: #ff6b6b;
      }
      dd input:valid ~ .helper-text {
        display: none;
      }
    </style>
  </head>
  <body>
    <form class="login-card">
      <h2>Sign Up</h2>

      <!-- First Name & Last Name -->
      <div class="row">
        <div class="input-box">
          <label for="firstname">First Name</label>
          <div class="input-wrapper">
            <i class="ri-user-3-fill left-icon"></i>
            <dd>
              <input
                type="text"
                id="firstname"
                name="firstname"
                placeholder="First Name"
                required
                pattern="^(?=.*[A-Z])\w{4,10}$"
              />
              <i class="ri-checkbox-circle-fill tick-icon"></i>
              <i class="ri-close-circle-fill cross-icon"></i>
              <i class="helper-text"
                >The number should be 10 digits (Starts with 6-9)</i
              >
            </dd>
          </div>
        </div>

        <div class="input-box">
          <label for="lastname">Last Name</label>
          <div class="input-wrapper">
            <i class="ri-user-3-fill left-icon"></i>
            <dd>
              <input
                type="text"
                id="lastname"
                name="lastname"
                placeholder="Last Name"
              />
            </dd>
          </div>
        </div>
      </div>

      <!-- Email Address -->
      <div class="input-box">
        <label for="email">Email</label>
        <div class="input-wrapper">
          <i class="ri-mail-fill left-icon"></i>
          <dd>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="example@mail.com"
              required
              pattern="^[a-zA-Z0-9._]+@gmail\.com$"
            />
            <i class="ri-checkbox-circle-fill tick-icon"></i>
            <i class="ri-close-circle-fill cross-icon"></i>
            <i class="helper-text"
              >The number should be 10 digits (Starts with 6-9)</i
            >
          </dd>
        </div>
      </div>

      <!-- Phone Number -->
      <div class="input-box">
        <label for="phone">Phone Number</label>
        <div class="input-wrapper phone-wrapper">
          <div class="phone-prefix">
            <span class="fi fi-in"></span>
            <span>+91</span>
          </div>
          <dd>
            <input
              type="text"
              id="phone"
              name="phone"
              placeholder="+91 9012345678"
              required
              pattern="^\+91\d{10}$"
            />
            <i class="ri-checkbox-circle-fill tick-icon"></i>
            <i class="ri-close-circle-fill cross-icon"></i>
            <i class="helper-text"
              >The number should be 10 digits (Starts with 6-9)</i
            >
          </dd>
        </div>
      </div>

      <!-- Password -->
      <div class="input-box">
        <label for="password">Password</label>
        <div class="input-wrapper">
          <i class="ri-lock-2-fill left-icon"></i>
          <dd>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Password"
              pattern="^(?.*=[a-z])(?.*=[A-Z])(?.*=[0-9])(?.*=[@$!%*?&#])[\w@$!%*?&#]{8,}$"
              required
            />
            <i class="ri-checkbox-circle-fill tick-icon"></i>
            <i class="ri-close-circle-fill cross-icon"></i>
            <i class="helper-text"
              >The number should be 10 digits (Starts with 6-9)</i
            >
          </dd>
        </div>
      </div>

      <!-- Gender -->
      <div class="input-box">
        <label>Gender</label>
        <div class="gender-options">
          <label class="radio-label">
            <input type="radio" name="gender" value="male" /> Male
          </label>
          <label class="radio-label">
            <input type="radio" name="gender" value="female" /> Female
          </label>
          <label class="radio-label">
            <input type="radio" name="gender" value="other" /> Other
          </label>
        </div>
      </div>

      <!-- Terms & Conditions -->
      <label class="terms-box">
        <input type="checkbox" name="terms" required />
        <span>I accept the <a href="#">Terms &amp; Conditions</a></span>
      </label>

      <!-- Submit Button -->
      <button type="submit" class="submit-btn">Sign Up</button>
    </form>
  </body>
</html>
