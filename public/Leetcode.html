<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Leetcode problem Page</title>
    <link
      rel="stylesheet"
      href="../node_modules/bootstrap-icons//font/bootstrap-icons.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Indie+Flower&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
      }

      /* top header leftside styling */
      .container {
        display: flex;
        flex-direction: column;
        gap: 10px;
        background-color: #f5f5f5;
        height: 100vh;
      }
      .top-header {
        padding: 10px;
        display: flex;
        flex-direction: row;
        justify-content: space-between;
      }
      .left-site {
        display: flex;
        flex-direction: row;
      }
      .sub-site {
        display: flex;
        flex-direction: row;
        align-items: center;
        gap: 10px;
      }
      .jslogo,
      .leetcodelogo {
        height: 25px;
      }
      .title {
        font-family: Arial;
        font-weight: bold;
      }
      .logo-site {
        padding: 5px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .right-border {
        border-right: 3px solid gray;
        height: 20px;
        margin-left: 5px;
      }
      .chalnge-title {
        display: flex;
        align-items: center;
        gap: 3px;
      }
      .bi-chevron-left,
      .bi-chevron-right,
      .bi-shuffle {
        font-size: 20px;
        color: #6b7280;
        cursor: pointer;
        transition: 0.2s;
      }
      .bi-chevron-left:hover,
      .bi-chevron-right:hover,
      .bi-shuffle:hover {
        color: #262626;
      }

      /* top-header middle section */

      .middle {
        display: flex;
        flex-direction: row;
        justify-content: center;
        align-items: center;
        gap: 10px;
        font-family: Arial;
      }
      .submit {
        display: flex;
        flex-direction: row;
        justify-content: center;
        align-items: center;
        gap: 5px;
        background-color: rgb(222, 221, 221);
        padding-right: 7px;

        border-radius: 5px;
      }
      svg {
        background-color: rgb(222, 221, 221);
        padding-top: 7px;
        padding-bottom: 7px;
        padding-right: 3px;
        padding-left: 3px;
        border-radius: 5px;
      }
      /* top-header Right section */
      .right-side {
        display: flex;
        align-items: center;
        gap: 10px;
        height: 56px;
        font-family: Inter, sans-serif;
      }

      .right-side > span {
        font-size: 20px;
        color: #6b7280;
        cursor: pointer;
        transition: 0.2s;
      }

      .right-side > span:hover {
        color: #262626;
      }

      .streak {
        display: flex;
        align-items: center;
        gap: 6px;
        color: #6b7280;
        font-size: 16px;
      }

      .streak i {
        font-size: 20px;
      }

      .streak span {
        font-size: 16px;
        font-weight: 500;
      }

      .profile {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        object-fit: cover;
        cursor: pointer;
      }

      .premium-btn {
        background: #fff3e0;
        color: #f59e0b;
        border: none;
        border-radius: 10px;
        padding: 8px 16px;
        font-size: 14px;
        font-weight: 500;
        font-family: Inter, sans-serif;
        cursor: pointer;
        transition: 0.2s;
      }

      .premium-btn:hover {
        background: #ffe9c2;
      }

      .right-side .bi {
        width: 36px;
        height: 36px;
        display: flex;
        justify-content: center;
        align-items: center;
        border-radius: 8px;
      }

      .right-side .bi:hover {
        background: #f3f4f6;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header class="top-header">
        <!-- leftside top-header -->
        <div class="left-site">
          <div class="logo-site">
            <img
              src="./images/leetcodelogo.png"
              alt="main-logo"
              class="leetcodelogo"
            />
            <div class="right-border"></div>
          </div>
          <div class="sub-site">
            <div class="chalnge-title">
              <img src="./images/jslogo.png" alt="js-logo" class="jslogo" />
              <span class="title">30 Days of Javascript</span>
            </div>
            <div>
              <span class="bi bi-chevron-left"></span>
              <span class="bi bi-chevron-right"></span>
            </div>
            <div>
              <span class="bi bi-shuffle"></span>
            </div>
          </div>
        </div>
        <!-- middle top-header -->
        <div class="middle">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="15"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="lucide lucide-bug-play-icon lucide-bug-play"
          >
            <path
              d="M10 19.655A6 6 0 0 1 6 14v-3a4 4 0 0 1 4-4h4a4 4 0 0 1 4 3.97"
            />
            <path
              d="M14 15.003a1 1 0 0 1 1.517-.859l4.997 2.997a1 1 0 0 1 0 1.718l-4.997 2.997a1 1 0 0 1-1.517-.86z"
            />
            <path d="M14.12 3.88 16 2" />
            <path d="M21 5a4 4 0 0 1-3.55 3.97" />
            <path d="M3 21a4 4 0 0 1 3.81-4" />
            <path d="M3 5a4 4 0 0 0 3.55 3.97" />
            <path d="M6 13H2" />
            <path d="m8 2 1.88 1.88" />
            <path d="M9 7.13V6a3 3 0 1 1 6 0v1.13" />
          </svg>
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="15"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="lucide lucide-play-icon lucide-play"
          >
            <path
              d="M5 5a2 2 0 0 1 3.008-1.728l11.997 6.998a2 2 0 0 1 .003 3.458l-12 7A2 2 0 0 1 5 19z"
            />
          </svg>
          <div class="submit">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="15"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="lucide lucide-cloud-upload-icon lucide-cloud-upload"
            >
              <path d="M12 13v8" />
              <path
                d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"
              />
              <path d="m8 17 4-4 4 4" />
            </svg>
            <p>Submit</p>
          </div>
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="15"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="lucide lucide-file-icon lucide-file"
          >
            <path
              d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z"
            />
            <path d="M14 2v5a1 1 0 0 0 1 1h5" />
          </svg>
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="15"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="lucide lucide-sparkles-icon lucide-sparkles"
          >
            <path
              d="M11.017 2.814a1 1 0 0 1 1.966 0l1.051 5.558a2 2 0 0 0 1.594 1.594l5.558 1.051a1 1 0 0 1 0 1.966l-5.558 1.051a2 2 0 0 0-1.594 1.594l-1.051 5.558a1 1 0 0 1-1.966 0l-1.051-5.558a2 2 0 0 0-1.594-1.594l-5.558-1.051a1 1 0 0 1 0-1.966l5.558-1.051a2 2 0 0 0 1.594-1.594z"
            />
            <path d="M20 2v4" />
            <path d="M22 4h-4" />
            <circle cx="4" cy="20" r="2" />
          </svg>
        </div>
        <!-- Rightside top-header -->
        <div class="right-side">
          <span class="bi bi-columns-gap"></span>

          <span class="bi bi-gear"></span>

          <span class="streak">
            <i class="bi bi-fire"></i>
            <span>0</span>
          </span>

          <span class="bi bi-stopwatch"></span>

          <span class="bi bi-person-plus"></span>

          <img src="./images/profile.png" class="profile" />

          <button class="premium-btn">Premium</button>
        </div>
      </header>
      <div class="main-section"></div>
    </div>
  </body>
</html>
