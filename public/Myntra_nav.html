<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Myntra Header</title>
    <!-- Bootstrap Icons CDN -->
    <link
      rel="stylesheet"
      href="/node_modules/bootstrap-icons/font/bootstrap-icons.css"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Arial, Helvetica, sans-serif;
        background-color: #051423;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 40px;
        background: #fff;
        box-shadow: 0 2px 5px white;
        gap: 20px;
      }

      /* Left Section */
      .left {
        display: flex;
        align-items: center;
        gap: 40px;
      }

      .logo {
        font-size: 28px;
        font-weight: 800;
        color: #ff3f6c;
        letter-spacing: -0.5px;
        cursor: pointer;
      }

      nav.links {
        display: flex;
        align-items: center;
        gap: 24px;
        margin-top: 5px;
      }

      nav.links a {
        text-decoration: none;
        color: #282c3f;
        font-size: 14px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.3px;
        transition: color 0.2s ease;
      }

      nav.links a:hover {
        color: #ff3f6c;
      }

      /* Middle Section */
      .mid {
        flex: 1;
        max-width: 450px;
        position: relative;
      }

      .search-wrapper {
        position: relative;
        display: flex;
        align-items: center;
      }

      .search-wrapper .bi-search {
        position: absolute;
        left: 14px;
        font-size: 16px;
        color: #696e79;
        pointer-events: none;
      }

      .input {
        width: 100%;
        padding: 10px 16px 10px 42px;
        border: 1px solid transparent;
        border-radius: 6px;
        background: rgb(229, 234, 233);
        font-size: 14px;
        color: #282c3f;
        outline: none;
        transition: all 0.2s ease;
      }

      /* Right Section */
      .right {
        display: flex;
        align-items: center;
        gap: 28px;
      }

      .icon {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 3px;
        cursor: pointer;
        color: #282c3f;
        transition: color 0.2s ease;
      }

      .icon .x {
        font-size: 20px;
      }

      .icon .text {
        font-size: 12px;
        font-weight: 700;
      }

      .icon:hover {
        color: #ff3f6c;
      }
      .bi-bag-fill {
        margin-right: 10px;
        font-size: 35px;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="left">
        <div class="logo">
          <span class="bi bi-bag-fill"></span><span>Myntra</span>
        </div>
        <nav class="links">
          <a href="#">Home</a>
          <a href="#">Shop</a>
          <a href="#">About</a>
          <a href="#">Contacts</a>
        </nav>
      </div>

      <div class="mid">
        <div class="search-wrapper">
          <span class="bi bi-search x"></span>
          <input type="text" placeholder="Search for products" class="input" />
        </div>
      </div>

      <div class="right">
        <div class="icon">
          <span class="bi bi-person x"></span>
          <span class="text">Profile</span>
        </div>
        <div class="icon">
          <span class="bi bi-heart x"></span>
          <span class="text">Wishlist</span>
        </div>
        <div class="icon">
          <span class="bi bi-bag x"></span>
          <span class="text">Bag</span>
        </div>
      </div>
    </header>
  </body>
</html>
