<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Netflix Banner</title>
    <link
      rel="stylesheet"
      href="/node_modules/bootstrap-icons/font/bootstrap-icons.css"
    />
  </head>
  <style>
    * {
      margin: 0;
      padding: 0;
    }
    body {
      background-size: cover;
      color: white;
    }
    .shade {
      background-color: rgba(0, 0, 0, 0.7);
      height: 100vh;
    }
    header {
      display: flex;
      flex-direction: row;
      justify-content: space-between;
      align-items: center;
      padding-top: 30px;
      padding-left: 140px;
      padding-right: 140px;
    }
    .logo {
      width: 170px;
    }
    .img {
      width: 100%;
      height: 100%;
    }
    .right-btn {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .language {
      border: 1px solid white;
      padding: 6px;
      border-radius: 6px;
    }
    .language span {
      margin-right: 5px;
    }
    .auth-btn {
      background-color: red;
      padding-top: 7px;
      padding-bottom: 7px;
      padding-left: 10px;
      padding-right: 10px;
      color: white;
      font-weight: 600;
      font-family: Arial, Helvetica, sans-serif;
      border-radius: 6px;
    }
  </style>
  <body background="./images/netflix.jpg">
    <div class="shade">
      <header>
        <div class="logo">
          <img src="./images/logo.svg" alt="logo" class="img" />
        </div>
        <div class="right-btn">
          <div class="language">
            <span class="bi bi-command"></span>
            <span>English</span>
            <span class="bi bi-chevron-down"></span>
          </div>
          <div class="auth-btn">
            <span>Sign in</span>
          </div>
        </div>
      </header>
      <main>
        <section>
         
        </section>
        <section>

        </section>
      </main>
    </div>
  </body>
</html>
