<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Netflix Banner</title>
    <link
      rel="stylesheet"
      href="/node_modules/bootstrap-icons/font/bootstrap-icons.css"
    />
  </head>
  <style>
    * {
      margin: 0;
      padding: 0;
    }
    body {
      background-size: cover;
      color: white;
    }
    .shade {
      background-color: rgba(0, 0, 0, 0.7);
      height: 100vh;
    }
    header {
      display: flex;
      flex-direction: row;
      justify-content: space-between;
      align-items: center;
      padding-top: 30px;
      padding-left: 140px;
      padding-right: 140px;
    }
    .logo {
      width: 170px;
    }
    .img {
      width: 100%;
      height: 100%;
    }
    .right-btn {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .language {
      border: 1px solid white;
      padding: 6px;
      border-radius: 6px;
    }
    .language span {
      margin-right: 5px;
    }
    .auth-btn {
      background-color: red;
      padding-top: 7px;
      padding-bottom: 7px;
      padding-left: 10px;
      padding-right: 10px;
      color: white;
      font-weight: 600;
      font-family: Arial, Helvetica, sans-serif;
      border-radius: 6px;
    }
    .anc {
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 15px;
      color: white;
      background: linear-gradient(to right, blue, rgb(29, 15, 17), red);
    }
    main {
      min-height: 80vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 2rem;
      text-align: center;
      padding: 20px;
    }

    .top-sec,
    .btm-sec,
    .entry-sec {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .top-sec {
      gap: 12px;
    }

    .main-title {
      font-size: clamp(2.5rem, 6vw, 4rem);
      font-weight: 700;
      line-height: 1.2;
    }

    .sub-title {
      font-size: clamp(1rem, 2vw, 1.5rem);
      color: #d1d5db;
    }

    .btm-sec {
      gap: 20px;
      width: 100%;
    }

    .entry-sec {
      width: 100%;
      max-width: 750px;
      flex-direction: column;
      gap: 12px;
    }

    .input {
      flex: 1;
      padding: 16px;
      font-size: 16px;
      border: 1px solid #666;
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      outline: none;
      transition: 0.3s;
      width: 80%;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 15px 25px;
      background: #e50914;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 20px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s;
    }
  </style>
  <body background="./images/netflix.jpg">
    <div class="shade">
      <section class="anc">
        <span class="bi bi-gift"></span>
        <span>New to Netflix ? Try 7 days for Freee.</span>
      </section>
      <header>
        <div class="logo">
          <img src="./images/logo.svg" alt="logo" class="img" />
        </div>
        <div class="right-btn">
          <div class="language">
            <span class="bi bi-command"></span>
            <span>English</span>
            <span class="bi bi-chevron-down"></span>
          </div>
          <div class="auth-btn">
            <span>Sign in</span>
          </div>
        </div>
      </header>
      <main>
        <section class="top-sec">
          <div class="main-title">
            Unlimited movies, <br />
            shows, and more
          </div>
          <div class="sub-title">Plans start at ₹149. Cancel anytime.</div>
        </section>
        <section class="btm-sec">
          <div>Ready to watch? Enter your email to start your membership.</div>
          <div class="entry-sec">
            <input type="text" placeholder="Email Adddress" class="input" />
            <div class="btn">
              <span>Try7 Days for $0 </span>
              <span class="bi bi-chevron-right"></span>
            </div>
          </div>
          <div>
            <span>New members only. Terms below. </span>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
