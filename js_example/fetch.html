<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Product Card</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css"
    />

    <style>
      :root {
        --mx: 50%;
        --my: 30%;
        --primary-indigo: #4f46e5;
        --dark-pill: #0f172a;
      }
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }

      /* Hide scrollbar for IE, Edge and Firefox */
      .no-scrollbar {
        -ms-overflow-style: none; /* IE and Edge */
        scrollbar-width: none; /* Firefox */
      }

      body {
        min-height: 100vh;
        margin: 0;
        padding-top: 85px; /* Offset for the fixed navbar */
        background-color: #f8fafc;
        color: #0f172a;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          sans-serif;
        position: relative;
        overflow-x: hidden;
      }

      /* Subtle ambient cursor background */
      .bg-glow {
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        background: radial-gradient(
          550px circle at var(--mx) var(--my),
          rgba(99, 102, 241, 0.08),
          transparent 65%
        );
        transition: background 0.15s ease-out;
      }

      .container {
        position: relative;
        z-index: 1;
      }

      /* CLEAN WHITE NAVBAR FIXED AT TOP */
      .glass-navbar {
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border-bottom: 1px solid #e2e8f0;
        z-index: 1030;
      }

      .brand-icon-box {
        width: 36px;
        height: 36px;
        background: linear-gradient(135deg, #6366f1, #4338ca);
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-size: 1.1rem;
        box-shadow: 0 4px 10px rgba(99, 102, 241, 0.25);
      }

      /* SEARCH BAR (from image: rounded pill with inside "Find ->" button) */
      .search-wrapper {
        background: #f1f5f9;
        border: 1px solid #e2e8f0;
        border-radius: 50rem;
        padding: 4px 6px 4px 16px;
        display: flex;
        align-items: center;
        max-width: 480px;
        width: 100%;
        transition:
          border-color 0.2s,
          box-shadow 0.2s;
      }
      .search-wrapper:focus-within {
        border-color: #6366f1;
        background: #ffffff;
        box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.12);
      }
      .search-wrapper input {
        border: none;
        background: transparent;
        font-size: 0.875rem;
        color: #334155;
        outline: none;
        width: 100%;
      }
      .search-wrapper input::placeholder {
        color: #94a3b8;
      }
      .btn-find {
        background: #4f46e5;
        color: #ffffff;
        border: none;
        border-radius: 50rem;
        padding: 5px 16px;
        font-size: 0.8rem;
        font-weight: 600;
        display: inline-flex;
        align-items: center;
        gap: 4px;
        transition: background 0.15s;
        white-space: nowrap;
      }
      .btn-find:hover {
        background: #4338ca;
        color: #fff;
      }

      /* CART BUTTON (from image: dark pill badge) */
      .btn-cart-pill {
        background: #0f172a;
        color: #fff;
        border: none;
        border-radius: 50rem;
        padding: 7px 16px;
        font-size: 0.85rem;
        font-weight: 600;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        text-decoration: none;
        box-shadow: 0 2px 6px rgba(15, 23, 42, 0.15);
      }
      .btn-cart-pill:hover {
        background: #1e293b;
        color: #fff;
      }
      .cart-count {
        background: #10b981;
        color: #fff;
        border-radius: 50rem;
        padding: 1px 7px;
        font-size: 0.72rem;
        font-weight: 700;
      }

      /* PILL FILTER TABS (from image) */
      .pill-filter-btn {
        background: #ffffff;
        border: 1px solid #e2e8f0;
        color: #64748b;
        border-radius: 50rem;
        padding: 6px 18px;
        font-size: 0.85rem;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.15s;
      }
      .pill-filter-btn:hover {
        border-color: #cbd5e1;
        color: #334155;
      }
      .pill-filter-btn.active {
        background: #0f172a;
        color: #ffffff;
        border-color: #0f172a;
      }

      /* WHITE MODERN CARD UI */
      .glass-card {
        background: #ffffff !important;
        border: 1px solid #e2e8f0 !important;
        border-radius: 20px !important;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.03);
        transition:
          transform 0.2s ease,
          box-shadow 0.2s ease,
          border-color 0.2s ease !important;
      }
      .glass-card:hover {
        transform: translateY(-4px);
        box-shadow: 0 12px 24px rgba(0, 0, 0, 0.06);
        border-color: #cbd5e1 !important;
        background: #ffffff !important;
      }
      .glass-card h6 {
        color: #0f172a !important;
        font-size: 0.95rem;
      }
      .glass-card .fs-5 {
        color: #0f172a !important;
        font-weight: 700;
      }
      .glass-card .text-muted,
      .glass-card .text-secondary {
        color: #64748b !important;
      }
      .glass-card .border-top {
        border-color: #f1f5f9 !important;
      }
      .glass-tag {
        background: #f1f5f9 !important;
        color: #475569 !important;
        border: 1px solid #e2e8f0 !important;
        font-size: 0.72rem;
        font-weight: 500;
      }
      .glass-btn {
        background: #0f172a !important;
        color: #ffffff !important;
        border-radius: 12px !important;
        font-weight: 600;
        padding: 9px;
        transition: background 0.15s;
      }
      .glass-btn:hover {
        background: #1e293b !important;
        color: #ffffff !important;
      }
      .glass-btn:disabled {
        background: #f1f5f9 !important;
        color: #94a3b8 !important;
        border: 1px solid #e2e8f0 !important;
        cursor: not-allowed;
      }
    </style>
  </head>

  <body onload="BodyLoad()" onmousemove="handleGlow(event)">
    <div class="offcanvas offcanvas-end" id="cart">
      <div class="min-vh-100 bg-dark text-white">
        <div
          class="offcanvas-header bg-dark text-white p-3 border-bottom border-secondary border-opacity-50"
        >
          <h5 class="offcanvas-title fw-bold" id="cartOffcanvasLabel">
            Total Items
          </h5>
          <button
            type="button"
            class="btn-close btn-close-white"
            data-bs-dismiss="offcanvas"
            aria-label="Close"
          ></button>
        </div>

        <div class="offcanvas-body">
          <div
            class="overflow-y-auto rounded-3 shadow-sm no-scrollbar"
            style="max-height: 550px"
          >
            <table
              class="table table-dark table-hover table-borderless align-middle mb-0"
            >
              <thead class="sticky-top bg-dark border-bottom border-secondary">
                <tr class="text-uppercase text-secondary small">
                  <th scope="col" class="py-3 ps-4 text-start bg-dark">
                    Product
                  </th>
                  <th scope="col" class="py-3 pe-4 text-end bg-dark">Review</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <!-- Interactive cursor-tracked glow -->
    <div class="bg-glow" aria-hidden="true"></div>

    <!-- WHITE MODERN NAVBAR (Fixed Top) -->
    <nav class="navbar navbar-expand-lg glass-navbar fixed-top py-3">
      <div class="container d-flex align-items-center justify-content-between">
        <!-- Logo & Concept Store Subtitle -->
        <a
          class="navbar-brand d-flex align-items-center gap-2 m-0 p-0 text-decoration-none"
          href="#"
        >
          <div class="brand-icon-box">✦</div>
          <div>
            <div
              class="fw-bold fs-5 leading-tight text-dark"
              style="line-height: 1.1"
            >
              Lumina
            </div>
            <div
              class="text-uppercase text-muted fw-semibold"
              style="font-size: 0.65rem; letter-spacing: 0.8px"
            >
              Concept Store
            </div>
          </div>
        </a>

        <!-- Search Bar with inside "Find ->" button -->
        <form
          class="d-flex mx-auto d-none d-md-flex align-items-center w-100 justify-content-center"
          role="search"
          style="max-width: 440px"
        >
          <div class="search-wrapper">
            <i class="bi bi-search text-muted me-2 small"></i>
            <input
              type="search"
              placeholder="Search gadgets, accessories, lifestyle..."
              id="search"
              onkeyup="searchClick()"
            />
            <button class="btn-find" type="button" onclick="searchClick()">
              Find &rarr;
            </button>
          </div>
        </form>

        <!-- Right Cart Pill -->
        <button
          class="btn-cart-pill"
          data-bs-target="#cart"
          data-bs-toggle="offcanvas"
        >
          <i class="bi bi-bag"></i>
          <span>Cart</span>
          <span class="cart-count" id="lblCart">0</span>
        </button>
      </div>
    </nav>

    <!-- HERO HEADER & FILTER PILLS -->
    <div class="container pt-4 pb-2">
      <div
        class="d-inline-flex align-items-center gap-2 px-3 py-1 rounded-pill mb-3"
        style="
          background: rgba(99, 102, 241, 0.1);
          color: #4f46e5;
          font-size: 0.75rem;
          font-weight: 600;
        "
      >
        <span>✦</span> Curated Essentials Collection
      </div>

      <div class="row align-items-end g-3 mb-4">
        <div class="col-lg-7">
          <h2
            class="fw-bold text-dark mb-1"
            style="font-size: 2.2rem; letter-spacing: -0.5px"
          >
            Everyday Modern Gear
          </h2>
          <p class="text-secondary mb-0" style="font-size: 0.95rem">
            Engineered for everyday durability, minimal design, and seamless
            performance.
          </p>
        </div>

        <!-- Filter Pill Tabs -->
        <div class="col-lg-5 d-flex justify-content-lg-end flex-wrap gap-2">
          <button
            class="pill-filter-btn active"
            data-category="all"
            onclick="tabLoad('all')"
          >
            All
          </button>

          <button
            class="pill-filter-btn"
            data-category="men's clothing"
            onclick="tabLoad(`men's clothing`)"
          >
            Men's
          </button>

          <button
            class="pill-filter-btn"
            data-category="jewelery"
            onclick="tabLoad('jewelery')"
          >
            Jwellery
          </button>

          <button
            class="pill-filter-btn"
            data-category="electronics"
            onclick="tabLoad('electronics')"
          >
            Electronics
          </button>

          <button
            class="pill-filter-btn"
            data-category="women's clothing"
            onclick="tabLoad(`women's clothing`)"
          >
            Women's
          </button>
        </div>
      </div>
    </div>
    <div
      class="d-flex justify-content-end align-items-end mb-3"
      style="padding-left: 150px; padding-right: 150px"
    >
      <div class="d-flex align-items-center gap-2 me-3">
        <small class="text-muted">$0</small>

        <input
          type="range"
          class="form-range"
          id="priceRange"
          min="0"
          max="1000"
          value="0"
          step="10"
          style="width: 120px"
          oninput="priceFilter(this.value)"
        />

        <small class="text-muted">$<span id="priceValue">1000</span> </small>
      </div>
      <div class="dropdown">
        <button
          class="btn btn-light border rounded-3 px-3 py-2 d-flex align-items-center gap-2"
          type="button"
          data-bs-toggle="dropdown"
        >
          <i class="bi bi-sliders2"></i>
          <span id="sortText">SORT BY</span>
          <i class="bi bi-chevron-down small"></i>
        </button>

        <ul
          class="dropdown-menu dropdown-menu-end shadow border-0 rounded-4 p-2"
        >
          <li>
            <button
              class="dropdown-item rounded-3"
              onclick="sortProducts('default')"
            >
              <i class="bi bi-grid me-2"></i>
              Default
            </button>
          </li>

          <li>
            <button
              class="dropdown-item rounded-3"
              onclick="sortProducts('priceHigh')"
            >
              <i class="bi bi-sort-numeric-down me-2"></i>
              Price: LOW to HIGH
            </button>
          </li>

          <li>
            <button
              class="dropdown-item rounded-3"
              onclick="sortProducts('priceLow')"
            >
              <i class="bi bi-sort-numeric-up me-2"></i>
              Price: HIGH to LOW
            </button>
          </li>

          <li>
            <hr class="dropdown-divider" />
          </li>

          <li>
            <button
              class="dropdown-item rounded-3"
              onclick="sortProducts('rating')"
            >
              <i class="bi bi-star me-2"></i>
              Rating: High to Low
            </button>
          </li>

          <li>
            <button
              class="dropdown-item rounded-3"
              onclick="sortProducts('nameAZ')"
            >
              <i class="bi bi-sort-alpha-down me-2"></i>
              Name: A to Z
            </button>
          </li>

          <li>
            <button
              class="dropdown-item rounded-3"
              onclick="sortProducts('nameZA')"
            >
              <i class="bi bi-sort-alpha-up me-2"></i>
              Name: Z to A
            </button>
          </li>
        </ul>
      </div>
    </div>

    <!-- PRODUCT CONTAINER -->
    <div class="container pb-5">
      <div class="row g-4" id="productContainer">
        <p id="load"></p>
      </div>
    </div>
    <div class="" id="toast"></div>
  </body>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
  <script>
    function handleGlow(e) {
      document.documentElement.style.setProperty("--mx", e.clientX + "px");
      document.documentElement.style.setProperty("--my", e.clientY + "px");
    }

    let cartItems = [];
    let allProducts = [];

    fetch("https://fakestoreapi.com/products")
      .then((response) => response.json())
      .then((products) => {
        allProducts = products;
        BodyLoad(products);
      });

    function searchClick() {
      let input = document.getElementById("search").value.trim().toLowerCase();
      fetch("https://fakestoreapi.com/products")
        .then((response) => {
          return response.json();
        })
        .then((product) => {
          let filteredProducts = product.filter((items) => {
            return (
              items?.title.toLowerCase().includes(input) ||
              items?.category.toLowerCase().includes(input)
            );
          });

          if (input === "") {
            BodyLoad();
            return;
          }

          document.getElementById("productContainer").innerHTML = "";

          if (filteredProducts.length === 0) {
            document.getElementById("productContainer").innerHTML = `
              <div class="col-12 text-center py-5">
                <div class="fs-1 text-muted">
                  <i class="bi bi-search"></i>
                </div>

                <h4 class="fw-bold mt-3">
                  No products found
                </h4>

                <p class="text-muted">
                  Try searching for another product, category, or tag.
                </p>
              </div>
            `;

            return;
          }

          BodyLoad(filteredProducts);
        });
    }

    function BodyLoad(product) {
      product.map((item, index) => {
        document.getElementById("productContainer").innerHTML += `
      <div class="col-6 col-md-4 col-lg-3">

        <div class="card glass-card border-0 rounded-4 overflow-hidden h-100">

          <!-- IMAGE -->
          <div class="position-relative">

            <img
              src="${item.image}"
              class="card-img-top"
              alt="${item.title}"
              style="height: 170px; object-fit: cover;"
            />



          </div>


          <!-- CARD BODY -->
          <div class="card-body p-3">

            <!-- CATEGORY -->
            <small class="text-muted">
              ${item.category}
            </small>


            <!-- TITLE + TAG -->
            <div class="d-flex justify-content-between align-items-center mt-1">

              <h6 class="fw-bold mb-0 text-truncate">
                ${item.title}
              </h6>

              <span class="badge bg-warning text-dark ms-2">
                ${item.rating.rate} ★
              </span>

            </div>


            <!-- RATING -->
            <div class="small mb-2">

              <span class="text-warning">
                ★★★★
              </span>

              <span class="text-muted">
                (${item.rating.count})
              </span>

            </div>


            <!-- DESCRIPTION -->
            <p class="text-secondary small mb-2 text-truncate">
              ${item.description}
            </p>


            <!-- PRICE -->
            <div class="mb-2">

              <span class="fw-bold fs-5">
                ${item.price.toLocaleString("en-US", { style: "currency", currency: "USD" })}
              </span>



            </div>





            <!-- BUTTON -->
            <button
            onClick="addClick(${item?.id})"
              class="btn glass-btn btn-sm w-100 mt-3 rounded-2"

            >
              Add to Cart
            </button>

          </div>

        </div>

      </div>
    `;
      });
    }

    function tabLoad(value) {
      const buttons = document.querySelectorAll(".pill-filter-btn");

      buttons.forEach((btn) => {
        const btnValue = btn.getAttribute("data-category");

        if (btnValue === value) {
          btn.classList.add("active");
        } else {
          btn.classList.remove("active");
        }
      });

      fetch("https://fakestoreapi.com/products")
        .then((response) => response.json())
        .then((products) => {
          if (value === "all") {
            document.getElementById("productContainer").innerHTML = "";
            BodyLoad(products);
            return;
          }

          const filteredProducts = products.filter((item) => {
            return (
              item.category.trim().toLowerCase() === value.trim().toLowerCase()
            );
          });

          document.getElementById("productContainer").innerHTML = "";

          BodyLoad(filteredProducts);
        })
        .catch((error) => {
          console.error("Error:", error);
        });
    }

    function sortProducts(value) {
      let sortText = document.getElementById("sortText");
      let sortItems = [...allProducts];
      if (value.trim() === "nameAZ") {
        sortItems.sort();
        sortText.innerHTML = `A-Z`;
      }
      if (value.trim() === "nameZA") {
        sortItems.sort();
        sortItems.reverse();
        sortText.innerHTML = `Z-A`;
      }

      if (value.trim() === "priceHigh") {
        sortItems.sort((a, b) => a.price - b.price);
        sortText.innerHTML = `$ LOW-HIGH`;
      }
      if (value.trim() === "priceLow") {
        sortItems.sort((a, b) => b.price - a.price);
        sortText.innerHTML = `$ HIGH-LOW`;
      }
      if (value.trim() === "rating") {
        sortItems.sort((a, b) => b.rating.rate - a.rating.rate);
        sortText.innerHTML = `$ HIGH-LOW`;
      }
      if (value === "default") {
        sortItems = allProducts;
        sortText.innerHTML = `DEFAULT`;
      }

      document.getElementById("productContainer").innerHTML = "";
      BodyLoad(sortItems);
    }

    function priceFilter(value) {
      document.getElementById("priceValue").textContent = value;

      const filteredProducts = allProducts.filter((product) => {
        return product.price <= Number(value);
      });

      document.getElementById("productContainer").innerHTML = "";

      BodyLoad(filteredProducts);
    }

    function updateCartCount() {
      let cartCount = document.getElementById("lblCart");
      cartCount.innerText = cartItems.length;
    }

    function addClick(id) {
      fetch(`https://fakestoreapi.com/products/${id}`)
        .then((response) => {
          return response.json();
        })
        .then((product) => {
          cartItems.push(product);
          updateCartCount();
          updateCart();
          Toastify({
            text: "✓  Product added to cart",
            duration: 3000,
            gravity: "top",
            position: "right",

            style: {
              background: "rgba(15, 15, 18, 0.92)",
              backdropFilter: "blur(16px)",
              WebkitBackdropFilter: "blur(16px)",
              border: "1px solid rgba(255, 255, 255, 0.12)",
              borderRadius: "16px",
              boxShadow:
                "0 20px 50px rgba(0,0,0,.35), 0 0 0 1px rgba(255,255,255,.03)",
              color: "#fff",
              fontSize: "14px",
              fontWeight: "500",
              padding: "14px 20px",
              minWidth: "300px",
            },

            stopOnFocus: true,
          }).showToast();
        });
    }

    function updateCart() {
      let tableBody = document.querySelector("tbody");
      let item = cartItems[cartItems.length - 1];

      let tr = document.createElement("tr");
      tr.classList = "border-bottom border-secondary border-opacity-25";

      let td1 = document.createElement("td");
      td1.innerHTML = `    <div class="d-flex flex-column gap-1">

          <h6 class="mb-0 fw-semibold text-white">
            ${item.title}
          </h6>

          <div class="d-flex align-items-center gap-2">
            <span class="fw-bold text-white">
              ${item.price.toLocaleString("en-US", {
                style: "currency",
                currency: "USD",
              })}
            </span>

            <span class="badge rounded-pill bg-light text-secondary fw-normal px-2 py-1">
              In Cart
            </span>
          </div>

        </div>`;
      td1.classList = "py-2 ps-4 text-start fw-medium  flex flex-col gap-2";
      td1.style.maxWidth = "250px";

      let td2 = document.createElement("td");
      td2.innerHTML = `
        <div class="d-inline-flex align-items-center justify-content-center
                    bg-light rounded-4 shadow-sm p-2"
             style="width: 82px; height: 82px;">

          <img
            src="${item.image}"
            alt="${item.title}"
            class="rounded-3 object-fit-contain"
            style="width: 65px; height: 65px;"
          />

        </div>
      `;
      td2.classList = "py-3 pe-4 text-end";
      tr.appendChild(td1);
      tr.appendChild(td2);

      // append row to table body
      tableBody.appendChild(tr);
    }
  </script>
</html>
