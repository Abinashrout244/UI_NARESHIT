<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Product Card</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <script>
      function BodyLoad() {
        fetch("../data/info.json")
          .then((response) => {
            return response.json();
          })
          .then((product) => {
            product.map((item, index) => {
              document.getElementById("productContainer").innerHTML += `
  <div class="col-6 col-md-4 col-lg-3">

    <div class="card border-0 shadow-sm rounded-3 overflow-hidden h-100">

      <!-- IMAGE -->
      <div class="position-relative">

        <img
          src="${item.images[0]}"
          class="card-img-top"
          alt="${item.name}"
          style="height: 170px; object-fit: cover;"
        />

        <!-- Availability -->
        <span class="position-absolute top-0 end-0 m-2 badge ${
          item.isAvailable ? "bg-success" : "bg-danger"
        }">
          ${item.isAvailable ? "Available" : "Out of Stock"}
        </span>

      </div>


      <!-- CARD BODY -->
      <div class="card-body p-3">

        <!-- CATEGORY -->
        <small class="text-muted">
          ${item.category}
        </small>


        <!-- TITLE + TAG -->
        <div class="d-flex justify-content-between align-items-center mt-1">

          <h6 class="fw-bold mb-0 text-truncate">
            ${item.name}
          </h6>

          <span class="badge bg-warning text-dark ms-2">
            ${item.rating} ★
          </span>

        </div>


        <!-- RATING -->
        <div class="small mb-2">

          <span class="text-warning">
            ★★★★
          </span>

          <span class="text-muted">
            (${item.reviewCount})
          </span>

        </div>


        <!-- DESCRIPTION -->
        <p class="text-secondary small mb-2 text-truncate">
          ${item.description}
        </p>


        <!-- PRICE -->
        <div class="mb-2">

          <span class="fw-bold fs-5">
            ${item.price}
          </span>

          <small class="text-muted">
            ${item.currency}
          </small>

        </div>


        <!-- SKU + STOCK -->
        <div class="d-flex justify-content-between small border-top pt-2">

          <span class="text-muted">
            SKU: ${item.sku}
          </span>

          <span class="text-muted">
            Stock: ${item.stock}
          </span>

        </div>


        <!-- TAGS -->
        <div class="mt-2">

          ${item.tags
            .map(
              (tag) => `
                <span class="badge rounded-pill bg-light text-dark border me-1">
                  ${tag}
                </span>
              `,
            )
            .join("")}

        </div>


        <!-- BUTTON -->
        <button
          class="btn btn-dark btn-sm w-100 mt-3 rounded-2"
          ${item.isAvailable ? "" : "disabled"}
        >
          ${item.isAvailable ? "Add to Cart" : "Unavailable"}
        </button>

      </div>

    </div>

  </div>
`;
            });
          });
      }
    </script>
  </head>

  <body class="bg-light" onload="BodyLoad()">
    <div class="container py-5">
      <div class="row g-4" id="productContainer"></div>
    </div>
  </body>
</html>
