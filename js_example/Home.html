<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bootstrap Premium Design</title>
    <link
      rel="stylesheet"
      href="../node_modules/bootstrap-icons/font/bootstrap-icons.css"
    />
    <link
      rel="stylesheet"
      href="../node_modules/bootstrap/dist/css/bootstrap.css"
    />
    <script src="../node_modules/bootstrap/dist/js/bootstrap.bundle.js"></script>
    <script type="text/javascript">
      function onEnter() {
        var value = prompt("Enter your text: ");
        if (value) {
          document.getElementById("text").innerHTML +=
            `<li class="list-group-item d-flex justify-content-between align-items-center">
              ${value}
              <i class="bi bi-trash text-danger" ${(onclick = "unDelete()")}></i>
            </li>`;
        } else if (value == "") {
          alert("Please enter something.");
        } else if (value == null) {
          alert("Please enter something. can't be null");
        }
      }

      function clearAll() {
        document.getElementById("text").innerHTML = "";
      }
    </script>
  </head>
  <body class="container py-5">
    <div class="row g-5">
      <div class="col-md-5">
        <div class="card shadow-lg w-75 border-0">
          <div class="card-body">
            <h2 class="card-title text-center mb-4 text-primary">Login</h2>
            <form method="get" action="./Result.html">
              <div class="mb-3">
                <label for="name" class="form-label">Name</label>
                <input
                  type="text"
                  name="userName"
                  class="form-control"
                  id="name"
                  placeholder="Enter Name"
                />
              </div>
              <div class="mb-3">
                <label for="city" class="form-label">Choose City</label>
                <select class="form-select" id="city" name="city">
                  <option>Select City</option>
                  <option>Hyderabad</option>
                  <option>Mumbai</option>
                  <option>Bangalore</option>
                  <option>Pune</option>
                </select>
              </div>
              <button class="btn btn-primary w-100 mt-4">Submit</button>
            </form>
          </div>
        </div>
      </div>

      <!-- Input & List Section -->
      <div class="col-md-7">
        <div class="d-flex gap-3 mb-4">
          <button class="btn btn-info" onclick="onEnter()">
            <i class="bi bi-plus-circle"></i> Add Item
          </button>
          <button class="btn btn-danger" onclick="clearAll()">
            <i class="bi bi-trash"></i> Clear All
          </button>
        </div>
        <ul id="text" class="list-group shadow-sm"></ul>
      </div>
    </div>
  </body>
</html>
