<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      rel="stylesheet"
      href="../node_modules/bootstrap-icons/font/bootstrap-icons.css"
    />
    <link
      rel="stylesheet"
      href="../node_modules/bootstrap/dist/css/bootstrap.css"
    />
    <script src="../node_modules/bootstrap/dist/js/bootstrap.bundle.js"></script>
  </head>
  <script>
    function saveData() {
      sessionStorage.setItem("user", "Abinash");
      sessionStorage.setItem("city", "HYD");
      document.getElementById("output").innerHTML = "Data Saved !";
    }

    function getData() {
      const user = sessionStorage.getItem("user");
      const city = sessionStorage.getItem("city");
      document.getElementById("output").innerHTML =
        `USER : ${user} <br> CITY : ${city}`;
    }

    function removeData() {
      sessionStorage.removeItem("city");
      document.getElementById("output").innerHTML = "CITY Removed!";
    }

    function clearAll() {
      sessionStorage.clear();
      document.getElementById("output").textContent = "All data cleared!";
    }
  </script>
  <body class="ps-3">
    <h2 class="p-5">Session Storage Demo</h2>
    <button onclick="saveData()" class="btn btn-primary">Save Data</button>
    <button onclick="getData()" class="btn btn-success">Get Data</button>
    <button onclick="removeData()" class="btn btn-danger">Remove Data</button>
    <button onclick="clearAll()" class="btn btn-warning">Clear All</button>
    <p id="output" class="p-5 fw-bold fs-6"></p>
  </body>
</html>
