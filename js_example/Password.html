<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Password</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="../node_modules/bootstrap-icons/font/bootstrap-icons.css"
    />
    <link
      rel="stylesheet"
      href="../node_modules/bootstrap/dist/css/bootstrap.css"
    />
    <script src="../node_modules/bootstrap/dist/js/bootstrap.bundle.js"></script>
    <style>
      body {
        font-family:
          "Plus Jakarta Sans",
          system-ui,
          -apple-system,
          sans-serif;
        letter-spacing: -0.01em;
      }
      #pwd::placeholder {
        color: #71717a;
        font-size: 0.95rem;
      }
      .input-wrapper {
        background: #18181b;
        border: 1px solid #27272a;
        border-radius: 12px;
        transition:
          border-color 0.2s ease,
          box-shadow 0.2s ease;
      }
      .input-wrapper:focus-within {
        border-color: #52525b;
        box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.03);
      }
      .custom-track {
        background-color: #27272a !important;
        border-radius: 9999px;
      }
    </style>
  </head>

  <body
    class="bg-dark min-vh-100 d-flex align-items-center justify-content-center p-3"
    style="background-color: #09090b !important"
  >
    <div style="width: 100%; max-width: 420px">
      <!-- Label -->
      <label for="pwd" class="form-label text-white fw-bold mb-2 fs-5"
        >Password</label
      >

      <div class="position-relative mb-3 input-wrapper">
        <input
          type="password"
          id="pwd"
          class="form-control text-light border-0 bg-transparent py-2 px-3 pe-5"
          placeholder="Password"
          onkeyup="verifyPwd()"
          style="outline: none; box-shadow: none"
        />
        <span
          id="togglePassword"
          class="position-absolute top-50 end-0 translate-middle-y pe-3 text-secondary role-button"
          style="cursor: pointer"
        >
          <i id="eyeIcon" class="bi bi-eye fs-5"></i>
        </span>
      </div>

      <div
        class="w-100 custom-track mb-4"
        style="height: 4px; overflow: hidden"
      >
        <div
          class="h-100 rounded-pill"
          style="
            width: 0%;
            background-color: #707070;
            transition:
              width 0.35s cubic-bezier(0.4, 0, 0.2, 1),
              background-color 0.35s ease;
          "
          id="progress"
        ></div>
      </div>

      <!-- Status & Requirements Row -->
      <div class="row g-2">
        <!-- Left Column: Must Contain List -->
        <div class="col-7">
          <span
            class="d-block text-white fw-bold mb-3"
            style="font-size: 0.95rem"
            >Must contain:</span
          >
          <ul class="list-unstyled d-flex flex-column gap-2 mb-0 small">
            <li class="d-flex align-items-center text-secondary" id="lblLength">
              <i class="bi bi-x fs-5 me-2 lh-1" id="iconLength"></i> At least 8
              characters
            </li>
            <li class="d-flex align-items-center text-secondary" id="lblNumber">
              <i class="bi bi-x fs-5 me-2 lh-1" id="iconNumber"></i> At least 1
              number
            </li>
            <li class="d-flex align-items-center text-secondary" id="lblUpper">
              <i class="bi bi-x fs-5 me-2 lh-1" id="iconUpper"></i> At least 1
              uppercase letter
            </li>
            <li class="d-flex align-items-center text-secondary" id="lblLower">
              <i class="bi bi-x fs-5 me-2 lh-1" id="iconLower"></i> At least 1
              lowercase letter
            </li>
            <li
              class="d-flex align-items-center text-secondary"
              id="lblSpecial"
            >
              <i class="bi bi-x fs-5 me-2 lh-1" id="iconSpecial"></i> At least 1
              special characters
            </li>
          </ul>
        </div>

        <div class="col-5 text-end">
          <span
            class="text-white fw-bold"
            id="pwdLebel"
            style="font-size: 0.95rem"
            >Enter a password</span
          >
        </div>
      </div>
    </div>

    <script type="text/javascript">
      const togglePassword = document.querySelector("#togglePassword");
      const password = document.querySelector("#pwd");
      const eyeIcon = document.querySelector("#eyeIcon");

      togglePassword.addEventListener("click", () => {
        const type =
          password.getAttribute("type") === "password" ? "text" : "password";
        password.setAttribute("type", type);

        eyeIcon.classList.toggle("bi-eye");
        eyeIcon.classList.toggle("bi-eye-slash");
      });

      function acceptInputTrue(btn, icon) {
        document.getElementById(btn).className =
          "d-flex align-items-center text-success fw-bold";
        document.getElementById(icon).className = "bi bi-check fs-5 me-2 lh-1";
      }
      function acceptInputFalse(btn, icon) {
        document.getElementById(btn).className =
          "d-flex align-items-center text-secondary";
        document.getElementById(icon).className = "bi bi-x fs-5 me-2 lh-1";
      }

      function verifyPwd() {
        let input = document.getElementById("pwd").value;
        let count = 0;
        // 1. Length check: at least 8 characters
        if (input.match(/.{8,}/)) {
          acceptInputTrue("lblLength", "iconLength");
          count++;
        } else {
          acceptInputFalse("lblLength", "iconLength");
        }

        // 2. Number check: at least 1 number
        if (input.match(/[0-9]/)) {
          acceptInputTrue("lblNumber", "iconNumber");
          count++;
        } else {
          acceptInputFalse("lblNumber", "iconNumber");
        }

        // 3. Uppercase check: at least 1 uppercase letter
        if (input.match(/[A-Z]/)) {
          acceptInputTrue("lblUpper", "iconUpper");
          count++;
        } else {
          acceptInputFalse("lblUpper", "iconUpper");
        }

        // 4. Lowercase check: at least 1 lowercase letter
        if (input.match(/[a-z]/)) {
          acceptInputTrue("lblLower", "iconLower");
          count++;
        } else {
          acceptInputFalse("lblLower", "iconLower");
        }

        // 5. Special character check: at least 1 special character
        if (input.match(/[!@#%&]/)) {
          acceptInputTrue("lblSpecial", "iconSpecial");
          count++;
        } else {
          acceptInputFalse("lblSpecial", "iconSpecial");
        }

        if (count == 1) {
          document.getElementById("pwdLebel").innerHTML = "Weak Password!";
          document.getElementById("progress").style.width = "30%";
          document.getElementById("progress").style.backgroundColor = "#e53935";
        } else if (count == 2) {
          document.getElementById("pwdLebel").innerHTML = "Medium Password!";
          document.getElementById("progress").style.width = "50%";
          document.getElementById("progress").style.backgroundColor = "#ee8308";
        } else if (count == 3) {
          document.getElementById("pwdLebel").innerHTML = "Strong password!!";
          document.getElementById("progress").style.width = "75%";
          document.getElementById("progress").style.backgroundColor = "#05b1fb";
        } else if (count == 4) {
          document.getElementById("pwdLebel").innerHTML =
            "Very Strong password!!!";
          document.getElementById("progress").style.width = "85%";
          document.getElementById("progress").style.backgroundColor = "#ed09cb";
        } else if (count >= 5) {
          document.getElementById("pwdLebel").innerHTML = "Perfect password!";
          document.getElementById("progress").style.width = "100%";
          document.getElementById("progress").style.backgroundColor = "#02ff12";
        } else {
          document.getElementById("progress").style.width = "0%";
          document.getElementById("pwdLebel").innerHTML = "Enter a password";
        }
      }
    </script>
  </body>
</html>
