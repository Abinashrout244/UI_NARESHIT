<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ResultsCalculator</title>
    <link
      rel="stylesheet"
      href="../node_modules/bootstrap-icons/font/bootstrap-icons.css"
    />
    <link
      rel="stylesheet"
      href="../node_modules/bootstrap/dist/css/bootstrap.css"
    />
    <script src="../node_modules/bootstrap/dist/js/bootstrap.bundle.js"></script>
    <style>
      /* Minimal custom CSS only for the custom color scheme and track bar */
      body {
        background-color: #1a2232;
      }
      .bg-custom-card {
        background-color: #263347;
      }
      .bg-custom-header {
        background-color: #202b3d;
      }
      .btn-orange {
        background-color: #f97316;
        color: #fff;
      }
      .btn-orange:hover {
        background-color: #ea580c;
        color: #fff;
      }
      .color-orange {
        color: #f97316;
      }

      .bmi-gauge {
        position: relative;
        height: 12px;
        border-radius: 10px;
        background: linear-gradient(
          to right,
          #5bc0de 0%,
          #5bc0de 25%,
          #5cb85c 25%,
          #5cb85c 50%,
          #f0ad4e 50%,
          #f0ad4e 75%,
          #d9534f 75%,
          #d9534f 100%
        );
      }

      .bmi-gauge-marker {
        position: absolute;
        top: -10px;
        left: 0%;

        width: 3px;
        height: 30px;

        background: #fff;
        border-radius: 10px;

        transform: translateX(-50%);

        box-shadow:
          0 0 4px rgba(255, 255, 255, 0.9),
          0 0 10px rgba(255, 255, 255, 0.5);

        transition: left 0.6s cubic-bezier(0.22, 1, 0.36, 1);

        z-index: 3;
      }

      .bmi-gauge-marker::after {
        content: "";

        position: absolute;
        left: 50%;
        bottom: -5px;

        width: 10px;
        height: 10px;

        background: #fff;

        transform: translateX(-50%) rotate(45deg);

        border-radius: 2px;

        box-shadow:
          0 0 5px rgba(255, 255, 255, 0.9),
          0 0 12px rgba(255, 255, 255, 0.45);
      }
    </style>

    <script type="text/javascript">
      function calculateClick() {
        let age = document.getElementById("lblAge").value;
        let fit = parseFloat(document.getElementById("lblFt").value);
        let inch = parseFloat(document.getElementById("lblInch").value);
        let weight = parseFloat(document.getElementById("lblKg").value);

        let totalInches = fit * 12 + inch;

        let meters = totalInches * 0.0254;

        let BMI = weight / (meters * meters);
        let BMI_RESULT = BMI.toFixed(2);

        const Results = Math.trunc(BMI_RESULT);
        let bmiCategory;

        if (Results < 16) {
          bmiCategory = "Severe Thinness";
        } else if (Results < 17) {
          bmiCategory = "Moderate Thinness";
        } else if (Results < 18.5) {
          bmiCategory = "Mild Thinness";
        } else if (Results < 25) {
          bmiCategory = "Normal";
        } else if (Results < 30) {
          bmiCategory = "Overweight";
        } else if (Results < 35) {
          bmiCategory = "Obese Class I";
        } else if (Results < 40) {
          bmiCategory = "Obese Class II";
        } else {
          bmiCategory = "Obese Class III";
        }

        function updateBMIGauge(Results) {
          let percentage;

          if (Results < 18.5) {
            percentage = (Results / 18.5) * 25;
          } else if (Results < 25) {
            percentage = 25 + ((Results - 18.5) / (25 - 18.5)) * 25;
          } else if (Results < 30) {
            percentage = 50 + ((Results - 25) / (30 - 25)) * 25;
          } else {
            percentage = 75 + Math.min(((Results - 30) / 20) * 25, 25);
          }

          document.querySelector(".bmi-gauge-marker").style.left =
            percentage + "%";
        }

        document.getElementById("lblBMI").innerHTML =
          `${BMI_RESULT} kg/m<sup>2</sup>`;
        document.getElementById("lblCategory").innerHTML = bmiCategory;
        updateBMIGauge(BMI);
      }
    </script>
  </head>
  <body class="p-3 p-md-5 text-light">
    <div class="container" style="max-width: 1050px">
      <div class="row g-4">
        <!-- LEFT PANEL: INPUT DATA -->
        <div class="col-12 col-lg-5">
          <div
            class="card bg-custom-card border-secondary border-opacity-25 shadow-sm"
          >
            <div
              class="card-header bg-custom-header border-secondary border-opacity-25 py-2 px-3"
            >
              <small class="fw-bold text-uppercase text-light"
                >Input Data</small
              >
            </div>

            <div class="card-body p-4">
              <!-- Gender -->
              <div class="mb-3">
                <label class="form-label small text-secondary">Gender</label>
                <div class="btn-group w-100" role="group">
                  <button
                    type="button"
                    class="btn btn-outline-secondary active text-light"
                  >
                    <i class="bi bi-gender-male me-1"></i> Male
                  </button>
                </div>
              </div>

              <!-- Age -->
              <div class="mb-3">
                <label class="form-label small text-secondary">Age</label>
                <div class="input-group">
                  <input
                    type="number"
                    class="form-control"
                    value="0"
                    id="lblAge"
                  />
                  <span class="input-group-text text-secondary">years</span>
                </div>
              </div>

              <!-- Height & Weight -->
              <div class="row g-2 mb-4">
                <div class="col-6">
                  <label class="form-label small text-secondary">Height</label>
                  <div class="input-group">
                    <input
                      type="number"
                      class="form-control px-2 text-center"
                      value="5"
                      style="max-width: 45px"
                      id="lblFt"
                    />
                    <span class="input-group-text px-2 text-secondary">ft</span>
                    <input
                      type="number"
                      class="form-control px-2 text-center"
                      value="9"
                      id="lblInch"
                    />
                    <span class="input-group-text px-2 text-secondary">in</span>
                  </div>
                </div>
                <div class="col-6">
                  <label class="form-label small text-secondary">Weight</label>
                  <div class="input-group">
                    <input
                      type="number"
                      class="form-control"
                      value="60"
                      id="lblKg"
                    />
                    <span class="input-group-text text-secondary">Kg</span>
                  </div>
                </div>
              </div>

              <!-- Actions Footer -->
              <div class="d-flex justify-content-between align-items-center">
                <button
                  onclick="calculateClick()"
                  class="btn btn-orange px-4 w-100 fw-medium"
                >
                  Calculate
                </button>
              </div>
            </div>
          </div>
        </div>

        <!-- RIGHT PANEL: ResultsRESULT -->
        <div class="col-12 col-lg-7">
          <div
            class="card bg-custom-card border-secondary border-opacity-25 shadow-sm"
          >
            <div
              class="card-header bg-custom-header border-secondary border-opacity-25 py-2 px-3"
            >
              <small class="fw-bold text-uppercase text-light"
                >Body Mass Index (BMI)</small
              >
            </div>

            <div class="card-body p-0">
              <!-- Gauge Section -->
              <div class="p-4 border-bottom border-secondary border-opacity-25">
                <div
                  class="d-flex justify-content-around text-secondary small mb-3"
                >
                  <span>Underweight</span>
                  <span>Normal</span>
                  <span>Overweight</span>
                  <span>Obesity</span>
                </div>

                <div class="bmi-gauge">
                  <div class="bmi-gauge-marker"></div>
                </div>
              </div>

              <!-- Results Table -->
              <div class="table-responsive m-0">
                <table
                  class="table table-dark table-striped-columns mb-0 align-middle small"
                >
                  <tbody>
                    <tr
                      class="border-bottom border-secondary border-opacity-25"
                    >
                      <td class="px-4 py-2 text-secondary w-50 bg-transparent">
                        Body Mass Index (BMI)
                      </td>
                      <td
                        id="lblBMI"
                        class="px-4 py-2 fw-bold text-white bg-transparent"
                      >
                        NaN
                      </td>
                    </tr>
                    <tr
                      class="border-bottom border-secondary border-opacity-25"
                    >
                      <td class="px-4 py-2 text-secondary bg-transparent">
                        ResultsCategory
                      </td>
                      <td
                        id="lblCategory"
                        class="px-4 py-2 fw-bold text-white bg-transparent"
                      >
                        -
                      </td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
